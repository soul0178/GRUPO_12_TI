spring:
  application:
    name: sistema-prestamos
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui

# Orígenes permitidos por CORS (separados por coma). Cada perfil define los suyos.
app:
  cors:
    allowed-origins: ""
  # Token JWT: la clave (mínimo 32 caracteres) viene de la variable JWT_SECRET; cada perfil define su origen.
  jwt:
    expiration-minutes: 480
