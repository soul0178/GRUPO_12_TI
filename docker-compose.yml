# Base de datos local para desarrollo (PostgreSQL 16).
# Los valores coinciden con los de backend/src/main/resources/application-dev.yml
services:
  db:
    image: postgres:16-alpine
    container_name: loans-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: loans
      POSTGRES_USER: loans
      POSTGRES_PASSWORD: loans
      TZ: UTC
    ports:
      - "5440:5432"
    volumes:
      - loans-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loans -d loans"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  loans-data:
